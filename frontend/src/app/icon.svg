    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(14 10) rotate(58) scale(48 45)" gradientUnits="userSpaceOnUse"><stop stop-color="#3DDDC6" stop-opacity=".2"/><stop offset="1" stop-color="#3DDDC6" stop-opacity="0"/></radialGradient>
    <linearGradient id="stem" x1="16" y1="14" x2="33" y2="42" gradientUnits="userSpaceOnUse"><stop stop-color="#9EF7DE"/><stop offset=".37" stop-color="#52D8E5"/><stop offset="1" stop-color="#5B8AF9"/></linearGradient>
    <linearGradient id="fold" x1="20" y1="39" x2="44" y2="51" gradientUnits="userSpaceOnUse"><stop stop-color="#557EF2"/><stop offset=".48" stop-color="#9778F5"/><stop offset="1" stop-color="#E4A2EE"/></linearGradient>
