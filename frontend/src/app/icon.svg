    <linearGradient id="rim" x1="11" y1="3" x2="52" y2="62" gradientUnits="userSpaceOnUse"><stop stop-color="#D1FFF1" stop-opacity=".32"/><stop offset=".5" stop-color="#AACBFF" stop-opacity=".08"/><stop offset="1" stop-color="#DABFFF" stop-opacity=".2"/></linearGradient>
