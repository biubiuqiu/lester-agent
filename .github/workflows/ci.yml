name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: test-only
      MASTER_KEY_BASE64: test-only
      SANDBOX_SERVICE_TOKEN: test-only
      MINIO_ROOT_PASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yaml config --quiet
      - run: docker compose -f deploy/docker-compose.yaml -f deploy/docker-compose.debug.yaml config --quiet
      - run: docker compose -p lester-gateway-test -f deploy/gateway/compose.test.yaml up --abort-on-container-exit --exit-code-from checks
      - if: always()
        run: docker compose -p lester-gateway-test -f deploy/gateway/compose.test.yaml down

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lester_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: lester_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lester_test -d lester_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      LESTER_TEST_DATABASE_URL: postgres://lester_test:test-only@localhost:5432/lester_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: go mod tidy
      - run: test -z "$(gofmt -l cmd internal prompts)"
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
      - run: helm lint deploy/helm/lester --set secrets.existingSecret=lester-test-secrets
      - run: helm template lester deploy/helm/lester --set secrets.existingSecret=lester-test-secrets --set artifactIngress.enabled=true > /dev/null
