{{- if not (has .Values.sandbox.provider (list "docker" "acs")) }}
{{- fail "sandbox.provider must be docker or acs" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lester.fullname" . }}-sandbox-service
  labels:
    {{- include "lester.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-service
spec:
  replicas: {{ if eq .Values.sandbox.provider "docker" }}1{{ else }}{{ .Values.sandbox.replicas }}{{ end }}
  strategy:
    type: {{ if eq .Values.sandbox.provider "docker" }}Recreate{{ else }}RollingUpdate{{ end }}
  selector:
    matchLabels:
      {{- include "lester.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sandbox-service
  template:
    metadata:
      annotations:
        checksum/sandbox-config: {{ toJson .Values.sandbox | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "lester.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sandbox-service
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.sandbox.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.sandbox.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.sandbox.affinity | nindent 8 }}
      containers:
        - name: sandbox-service
          image: {{ include "lester.image" (list .Values.images.sandboxService .) }}
          imagePullPolicy: {{ .Values.images.sandboxService.pullPolicy }}
          env:
            - name: HTTP_ADDR
              value: :8090
            - name: SANDBOX_PROVIDER
              value: {{ .Values.sandbox.provider | quote }}
            - name: SANDBOX_IMAGE
              value: {{ .Values.sandbox.image | quote }}
            - name: SANDBOX_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lester.secretName" . }}
                  key: SANDBOX_SERVICE_TOKEN
            {{- if eq .Values.sandbox.provider "acs" }}
            - name: ACS_SANDBOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lester.secretName" . }}
                  key: ACS_SANDBOX_API_KEY
            - name: ACS_SANDBOX_DOMAIN
              value: {{ .Values.sandbox.acs.domain | quote }}
            - name: ACS_SANDBOX_SCHEME
              value: {{ .Values.sandbox.acs.scheme | quote }}
            - name: ACS_SANDBOX_PROTOCOL
              value: {{ .Values.sandbox.acs.protocol | quote }}
            - name: ACS_SANDBOX_API_URL
              value: {{ .Values.sandbox.acs.apiURL | quote }}
            - name: ACS_SANDBOX_BASE_URL
              value: {{ .Values.sandbox.acs.sandboxBaseURL | quote }}
            - name: ACS_SANDBOX_TEMPLATE
              value: {{ .Values.sandbox.acs.template | quote }}
            - name: ACS_SANDBOX_TIMEOUT_SECONDS
              value: {{ .Values.sandbox.acs.timeoutSeconds | quote }}
            - name: ACS_SANDBOX_REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.sandbox.acs.requestTimeoutSeconds | quote }}
            - name: ACS_SANDBOX_RUNTIME_PORT
              value: {{ .Values.sandbox.acs.runtimePort | quote }}
            - name: ACS_SANDBOX_SECURE
              value: {{ .Values.sandbox.acs.secure | quote }}
            - name: ACS_SANDBOX_AUTO_PAUSE
              value: {{ .Values.sandbox.acs.autoPause | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            {{- toYaml .Values.resources.sandboxService | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: {type: RuntimeDefault}
          {{- if eq .Values.sandbox.provider "docker" }}
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
          {{- end }}
      {{- if eq .Values.sandbox.provider "docker" }}
      volumes:
        - name: docker-socket
          hostPath:
            path: {{ .Values.sandbox.dockerSocketPath | quote }}
            type: Socket
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lester.fullname" . }}-sandbox-service
  labels:
    {{- include "lester.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "lester.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-service
  ports:
    - name: http
      port: {{ .Values.service.sandboxService.port }}
      targetPort: http
