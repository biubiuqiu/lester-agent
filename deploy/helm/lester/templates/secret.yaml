{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lester.secretName" . }}
  labels:
    {{- include "lester.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseURL is required when secrets.existingSecret is empty" .Values.secrets.databaseURL | quote }}
  REDIS_URL: {{ required "secrets.redisURL is required when secrets.existingSecret is empty" .Values.secrets.redisURL | quote }}
  MASTER_KEY_BASE64: {{ required "secrets.masterKeyBase64 is required when secrets.existingSecret is empty" .Values.secrets.masterKeyBase64 | quote }}
  SANDBOX_SERVICE_TOKEN: {{ required "secrets.sandboxServiceToken is required when secrets.existingSecret is empty" .Values.secrets.sandboxServiceToken | quote }}
  OBJECT_STORE_ACCESS_KEY: {{ required "secrets.objectStoreAccessKey is required when secrets.existingSecret is empty" .Values.secrets.objectStoreAccessKey | quote }}
  OBJECT_STORE_SECRET_KEY: {{ required "secrets.objectStoreSecretKey is required when secrets.existingSecret is empty" .Values.secrets.objectStoreSecretKey | quote }}
  {{- if eq .Values.sandbox.provider "acs" }}
  ACS_SANDBOX_API_KEY: {{ required "secrets.acsSandboxAPIKey is required when sandbox.provider=acs" .Values.secrets.acsSandboxAPIKey | quote }}
  {{- end }}
{{- end }}

