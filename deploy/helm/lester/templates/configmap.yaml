apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lester.fullname" . }}-config
  labels:
    {{- include "lester.labels" . | nindent 4 }}
data:
  WEB_ORIGIN: {{ required "config.webOrigin is required" .Values.config.webOrigin | trimSuffix "/" | quote }}
  ARTIFACT_PUBLIC_URL: {{ required "config.artifactPublicURL is required" .Values.config.artifactPublicURL | trimSuffix "/" | quote }}
  SESSION_COOKIE_SECURE: {{ .Values.config.sessionCookieSecure | quote }}
  AUTH_TRUSTED_PROXY_CIDRS: {{ .Values.config.auth.trustedProxyCIDRs | quote }}
  AUTH_REGISTRATION_ENABLED: {{ .Values.config.auth.registrationEnabled | quote }}
  CONNECTOR_GITHUB_CLIENT_ID: {{ .Values.config.appConnectors.githubClientID | quote }}
  CONNECTOR_GMAIL_CLIENT_ID: {{ .Values.config.appConnectors.gmailClientID | quote }}
  CONNECTOR_X_CLIENT_ID: {{ .Values.config.appConnectors.xClientID | quote }}
  CONNECTOR_FEISHU_CLIENT_ID: {{ .Values.config.appConnectors.feishuClientID | quote }}
  CONNECTOR_SLACK_CLIENT_ID: {{ .Values.config.appConnectors.slackClientID | quote }}
  GOOGLE_OAUTH_CLIENT_ID: {{ .Values.config.auth.googleClientID | quote }}
  GITHUB_OAUTH_CLIENT_ID: {{ .Values.config.auth.githubClientID | quote }}
  SMTP_HOST: {{ .Values.config.auth.smtpHost | quote }}
  SMTP_PORT: {{ .Values.config.auth.smtpPort | quote }}
  SMTP_USERNAME: {{ .Values.config.auth.smtpUsername | quote }}
  SMTP_FROM: {{ .Values.config.auth.smtpFrom | quote }}
  SMTP_TLS_MODE: {{ .Values.config.auth.smtpTLSMode | quote }}
  OBJECT_STORE_ENDPOINT: {{ required "config.objectStore.endpoint is required" .Values.config.objectStore.endpoint | quote }}
  OBJECT_STORE_BUCKET: {{ required "config.objectStore.bucket is required" .Values.config.objectStore.bucket | quote }}
  OBJECT_STORE_USE_SSL: {{ .Values.config.objectStore.useSSL | quote }}

  OTEL_SDK_DISABLED: {{ .Values.config.telemetry.sdkDisabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.telemetry.endpoint | quote }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ .Values.config.telemetry.tracesEndpoint | quote }}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: {{ .Values.config.telemetry.metricsEndpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.config.telemetry.protocol | quote }}
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: {{ .Values.config.telemetry.tracesProtocol | quote }}
  OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: {{ .Values.config.telemetry.metricsProtocol | quote }}
  OTEL_RESOURCE_ATTRIBUTES: {{ .Values.config.telemetry.resourceAttributes | quote }}
  OTEL_TRACES_SAMPLER: {{ .Values.config.telemetry.tracesSampler | quote }}
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.config.telemetry.tracesSamplerArg | quote }}
  OTEL_TRACES_EXPORTER: {{ .Values.config.telemetry.tracesExporter | quote }}
  OTEL_METRICS_EXPORTER: {{ .Values.config.telemetry.metricsExporter | quote }}
  OTEL_METRIC_EXPORT_INTERVAL: {{ .Values.config.telemetry.metricExportInterval | quote }}
