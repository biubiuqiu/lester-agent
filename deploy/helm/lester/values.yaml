nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

images:
  api:
    repository: ghcr.io/biubiuqiu/lester-agent-api
    tag: ""
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/biubiuqiu/lester-agent-web
    tag: ""
    pullPolicy: IfNotPresent
  artifactHost:
    repository: ghcr.io/biubiuqiu/lester-agent-artifact-host
    tag: ""
    pullPolicy: IfNotPresent
  sandboxService:
    repository: ghcr.io/biubiuqiu/lester-agent-sandbox-service
    tag: ""
    pullPolicy: IfNotPresent

replicaCount:
  artifactHost: 1
  api: 1
  web: 1

config:
  # Must exactly match the public browser origin, without a trailing slash.
  webOrigin: https://lester.example.com
  artifactPublicURL: https://sites.example.net
  sessionCookieSecure: true
  objectStore:
    endpoint: s3.example.com
    bucket: lester-skills
    useSSL: true

secrets:
  # If set, the chart does not create a Secret. The referenced Secret must
  # contain DATABASE_URL, REDIS_URL, MASTER_KEY_BASE64,
  # SANDBOX_SERVICE_TOKEN, OBJECT_STORE_ACCESS_KEY and OBJECT_STORE_SECRET_KEY.
  existingSecret: ""
  databaseURL: ""
  redisURL: ""
  masterKeyBase64: ""
  sandboxServiceToken: ""
  objectStoreAccessKey: ""
  objectStoreSecretKey: ""
  # Required when sandbox.provider=acs. It must match the API key configured
  # on ack-sandbox-manager.
  acsSandboxAPIKey: ""

service:
  artifactHost:
    port: 8082
  api:
    port: 8080
  web:
    port: 3000
  sandboxService:
    port: 8090

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: lester.example.com
  tls: []

sandbox:
  # docker keeps the self-hosted Docker Engine backend; acs uses Alibaba
  # Cloud ACS Agent Sandbox through its E2B-compatible endpoint.
  provider: docker
  replicas: 2
  image: python:3.12-slim
  # Used only by the Docker provider. Pin the service to a dedicated worker.
  dockerSocketPath: /var/run/docker.sock
  nodeSelector: {}
  tolerations: []
  affinity: {}
  acs:
    domain: ""
    scheme: https
    # native is recommended for production; private uses a single-domain
    # /kruise path and is useful for internal/test deployments.
    protocol: native
    apiURL: ""
    sandboxBaseURL: ""
    template: lester-agent
    timeoutSeconds: 3600
    requestTimeoutSeconds: 60
    runtimePort: 49983
    secure: true
    autoPause: true
    sandboxSet:
      # Enable only when this release should own the ACS warm-pool template.
      enabled: false
      replicas: 4
      image: ""
      imagePullPolicy: IfNotPresent
      computeQoS: default
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: "1"
          memory: 1Gi
          ephemeral-storage: 30Gi

networkPolicy:
  enabled: false

resources:
  artifactHost: {}
  api: {}
  web: {}
  sandboxService: {}

podAnnotations: {}
podLabels: {}


artifactIngress:
  enabled: false
  className: ""
  annotations: {}
  host: sites.example.net
  tls: []
