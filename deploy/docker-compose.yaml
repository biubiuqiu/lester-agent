services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lester}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-lester}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../backend/migrations/000001_phase_0_4.up.sql:/docker-entrypoint-initdb.d/001.sql:ro
      - ../backend/migrations/000002_user_sandboxes.up.sql:/docker-entrypoint-initdb.d/002.sql:ro
      - ../backend/migrations/000003_skills_attachments.up.sql:/docker-entrypoint-initdb.d/003.sql:ro
      - ../backend/migrations/000004_durable_transcript.up.sql:/docker-entrypoint-initdb.d/004.sql:ro
      - ../backend/migrations/000005_user_profiles.up.sql:/docker-entrypoint-initdb.d/005.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lester}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in deploy/.env}
    volumes: [minio-data:/data]
    expose: ["9000", "9001"]

  sandbox-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.sandbox-service
    environment:
      HTTP_ADDR: :8090
      SANDBOX_PROVIDER: docker
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-python:3.12-slim}
      SANDBOX_SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN:?SANDBOX_SERVICE_TOKEN must be set in deploy/.env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose: ["8090"]

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.api
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-lester}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}@postgres:5432/${POSTGRES_DB:-lester}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:13000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SANDBOX_SERVICE_URL: http://sandbox-service:8090
      SANDBOX_SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN:?SANDBOX_SERVICE_TOKEN must be set in deploy/.env}
      MASTER_KEY_BASE64: ${MASTER_KEY_BASE64:?MASTER_KEY_BASE64 must be set in deploy/.env}
      OBJECT_STORE_ENDPOINT: minio:9000
      OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:-lester}
      OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in deploy/.env}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-lester-skills}
      OBJECT_STORE_USE_SSL: "false"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      sandbox-service: {condition: service_started}
      minio: {condition: service_started}
    expose: ["8080"]

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Build-time setting: keep all browser traffic on the gateway origin,
        # even if an older deploy/.env still defines NEXT_PUBLIC_API_URL.
        NEXT_PUBLIC_API_URL: ""
    depends_on: [api]
    expose: ["3000"]

  gateway:
    image: nginx:1.28-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["${GATEWAY_PORT:-13000}:8080"]
    depends_on: [api, web]
    restart: unless-stopped
    healthcheck:
      # Gateway liveness only; upstream readiness is checked separately.
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  minio-data:
