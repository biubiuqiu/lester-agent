# Isolated proxy contract tests: no host ports, credentials or application data.
services:
  upstream:
    image: node:22-alpine
    command: [node, /test.mjs, serve]
    volumes: ["./test.mjs:/test.mjs:ro"]
    networks:
      default:
        aliases: [api, web]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 1s
      timeout: 3s
      retries: 20
  gateway:
    image: nginx:1.28-alpine
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      upstream: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 3s
      retries: 20
  checks:
    image: node:22-alpine
    command: [node, /test.mjs, check]
    volumes: ["./test.mjs:/test.mjs:ro"]
    depends_on:
      gateway: {condition: service_healthy}
