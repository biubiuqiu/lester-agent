worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Avoid recording query parameters, cookies or authorization in access logs.
    log_format gateway '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout gateway;

    # Docker DNS + shared upstream zones follow service IP changes on recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream lester_api {
        zone lester_api 64k;
        server api:8080 resolve;
        keepalive 16;
    }
    upstream lester_web {
        zone lester_web 64k;
        server web:3000 resolve;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    server {
        listen 8080;
        # API accepts a 25 MiB file plus at most 1 MiB multipart overhead.
        client_max_body_size 26m;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        # This listener is the HTTP edge. See README for HTTPS termination.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        # Match /api itself and /api/*, never /apiculture or Next.js routes.
        location ~ ^/api(?:/|$) {
            # No URI suffix: preserve the path, escaping and query string.
            proxy_pass http://lester_api;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            # Idle timeout, not a maximum Agent run duration; SSE sends heartbeats.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # Never automatically replay a message/upload/mutation on another API.
            proxy_next_upstream off;
        }

        location / {
            proxy_pass http://lester_web;
            proxy_read_timeout 60s;
        }
    }
}
