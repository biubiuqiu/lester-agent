<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; frame-src 'self' blob: about:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Lester</title>
  <link rel="icon" href="assets/lester.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/xterm.css">
  <link rel="stylesheet" href="styles.css">
  <script src="assets/xterm.js" defer></script>
  <script src="assets/addon-fit.js" defer></script>
  <script src="app.js" type="module"></script>
</head>
<body>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-2 7M20 4v6h-6"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3Z"/></symbol>
      <symbol id="icon-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 4-5 7-8 9-3-2-8-5-8-9V6Z"/></symbol>
      <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 3v-3a2 2 0 0 1-2-2V6a2 2 0 0 1 3-2Z"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><path d="m9 3-.7 2.5-2.4 1L3.7 6 2 9l1.8 1.8v2.4L2 15l1.7 3 2.2-.5 2.4 1L9 21h6l.7-2.5 2.4-1 2.2.5 1.7-3-1.8-1.8v-2.4L22 9l-1.7-3-2.2.5-2.4-1L15 3Z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="icon-model" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/></symbol>
      <symbol id="icon-cloud" viewBox="0 0 24 24"><path d="M7 18a5 5 0 1 1 .4-10A6 6 0 0 1 19 10a4 4 0 0 1 0 8Z"/></symbol>
      <symbol id="icon-computer" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></symbol>
    </defs>
  </svg>
  <div id="app">
    <aside class="sidebar" data-aria="navigation" aria-label="Navigation">
      <div class="brand"><img src="assets/lester.svg" alt="" width="30" height="30"><strong>Lester</strong></div>
      <button id="new-task" class="new-task"><svg class="ui-icon" aria-hidden="true"><use href="#icon-plus"/></svg><span data-t="newTask"></span><span id="new-task-shortcut" class="shortcut" aria-hidden="true"></span></button>
      <div class="search-field"><svg class="ui-icon" aria-hidden="true"><use href="#icon-search"/></svg><input id="search" type="search" data-placeholder="search" aria-label="Search"></div>
      <div id="sidebar-scroll" class="sidebar-scroll">
        <div class="sidebar-heading"><span data-t="projects"></span><button id="choose-project" class="icon-button" data-title="openFolder" aria-label="Open folder"><svg class="ui-icon" aria-hidden="true"><use href="#icon-plus"/></svg></button></div>
        <nav id="project-list" class="project-list"></nav>
        <section id="recent-section" hidden>
          <div class="sidebar-heading"><span data-t="recent"></span></div>
          <nav id="conversation-list" class="conversation-list"></nav>
        </section>
      </div>
      <div class="sidebar-footer">
        <div class="device-row"><div id="device-status" class="device-status"></div><button id="refresh" class="icon-button" data-title="refresh" aria-label="Refresh"><svg class="ui-icon" aria-hidden="true"><use href="#icon-refresh"/></svg></button></div>
        <button id="settings-button" class="settings-button"><svg class="ui-icon" aria-hidden="true"><use href="#icon-settings"/></svg><span data-t="settings"></span><span id="settings-shortcut" class="shortcut" aria-hidden="true"></span></button>
      </div>
    </aside>
    <main id="main">
      <header class="topbar">
        <div class="context"><strong id="conversation-title"></strong><span id="conversation-context"></span></div>
        <button id="workspace-toggle" class="quiet-button workspace-toggle" aria-controls="workspace" aria-expanded="false"><svg class="ui-icon" aria-hidden="true"><use href="#icon-computer"/></svg><span data-t="workspace"></span></button>
      </header>
      <div id="global-notice" class="notice" role="status" hidden></div>
      <div id="cloud-content" hidden></div>
      <div id="local-content" class="local-content">
        <section id="chat" class="chat is-new">
          <div id="transcript" class="transcript" tabindex="0" data-aria="conversation" aria-label="Conversation">
            <div id="welcome" class="welcome">
              <img src="assets/lester.svg" alt="" width="48" height="48">
              <h1 data-t="welcome"></h1><p data-t="welcomeHint"></p>
              <div class="welcome-actions"><button id="welcome-project" class="secondary-button" data-t="openFolder"></button><button id="welcome-model" class="secondary-button" data-t="configureModel" hidden></button></div>
            </div>
            <div id="messages" class="messages" aria-live="off"></div>
          </div>
          <button id="jump-bottom" class="jump-bottom" data-t="newContent" hidden></button>
          <div id="composer-area" class="composer-area">
            <div id="approval" class="approval" hidden></div>
            <div id="receipt" class="notice receipt" role="status" hidden></div>
            <form id="composer" class="composer">
              <textarea id="prompt" rows="3" maxlength="65536" data-placeholder="prompt" aria-label="Message"></textarea>
              <div class="composer-controls">
                <div class="composer-select"><svg class="ui-icon" aria-hidden="true"><use href="#icon-folder"/></svg><select id="project-picker" data-title="project" aria-label="Project"></select></div>
                <div class="composer-select permission-select"><svg class="ui-icon" aria-hidden="true"><use href="#icon-shield"/></svg><select id="permission-mode" data-title="permissionMode" aria-label="Permissions"><option value="standard" data-t="standard"></option><option value="auto" data-t="auto"></option><option value="full" data-t="full"></option></select></div>
                <span class="spacer"></span>
                <div class="composer-select model-select"><select id="model-picker" data-title="model" aria-label="Model"></select></div>
                <button id="send" class="send-button" type="submit" data-title="send" aria-label="Send"><svg class="ui-icon" aria-hidden="true"><use href="#icon-arrow"/></svg></button>
                <button id="stop" class="stop-button" type="button" data-t="stop" hidden></button>
              </div>
            </form>
            <p id="composer-hint" class="composer-hint"></p>
          </div>
        </section>
        <section id="workspace" class="workspace" hidden data-aria="workspace" aria-label="Workspace">
          <div class="workspace-toolbar">
            <div class="workspace-tabs" role="tablist"><button id="pane-files" data-pane="files" role="tab" aria-controls="workspace-body" data-t="files"></button><button id="pane-diff" data-pane="diff" role="tab" aria-controls="workspace-body" data-t="changes"></button><button id="pane-terminal" data-pane="terminal" role="tab" aria-controls="workspace-body" data-t="terminal"></button></div>
            <button id="close-workspace" class="icon-button" data-title="close" aria-label="Close"><svg class="ui-icon" aria-hidden="true"><use href="#icon-close"/></svg></button>
          </div>
          <div id="workspace-body" class="workspace-body" role="tabpanel" aria-labelledby="pane-files"></div>
        </section>
      </div>
    </main>
  </div>
  <dialog id="settings" class="settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-heading"><h2 id="settings-title" data-t="settings"></h2><button id="close-settings" class="icon-button" data-title="close" aria-label="Close"><svg class="ui-icon" aria-hidden="true"><use href="#icon-close"/></svg></button></div>
    <div class="settings-layout">
      <nav class="settings-nav" role="tablist" aria-orientation="vertical" data-aria="settings" aria-label="Settings">
        <button id="settings-tab-general" data-settings-panel="general" role="tab" aria-controls="settings-general" aria-selected="true"><svg class="ui-icon" aria-hidden="true"><use href="#icon-settings"/></svg><span data-t="general"></span></button>
        <button id="settings-tab-models" data-settings-panel="models" role="tab" aria-controls="settings-models" aria-selected="false" tabindex="-1"><svg class="ui-icon" aria-hidden="true"><use href="#icon-model"/></svg><span data-t="models"></span></button>
        <button id="settings-tab-cloud" data-settings-panel="cloud" role="tab" aria-controls="settings-cloud" aria-selected="false" tabindex="-1"><svg class="ui-icon" aria-hidden="true"><use href="#icon-cloud"/></svg><span data-t="cloud"></span></button>
      </nav>
      <div class="settings-content">
        <div class="settings-scroll">
          <section id="settings-general" role="tabpanel" aria-labelledby="settings-tab-general">
            <h3 data-t="general"></h3>
            <label class="language-row"><span data-t="language"></span><select id="language"><option value="zh-CN">简体中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="fr">Français</option><option value="es">Español</option></select></label>
            <p id="storage-status" class="field-hint storage-status"></p>
          </section>
          <section id="settings-models" role="tabpanel" aria-labelledby="settings-tab-models" hidden>
            <div class="section-heading"><h3 data-t="models"></h3><button id="add-model" class="secondary-button"><svg class="ui-icon" aria-hidden="true"><use href="#icon-plus"/></svg><span data-t="addModel"></span></button></div>
            <div id="model-list"></div>
            <form id="model-form" hidden>
              <input name="id" type="hidden">
              <label><span data-t="name"></span><input name="name" required maxlength="200"></label>
              <label><span data-t="provider"></span><select name="provider"><option value="openai_compatible">OpenAI compatible</option><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option><option value="anthropic_compatible">Anthropic compatible</option><option value="azure_openai">Azure OpenAI</option><option value="vertex">Vertex Anthropic</option><option value="foundry">Foundry Anthropic</option><option value="bedrock">Amazon Bedrock</option></select></label>
              <label><span data-t="endpoint"></span><input name="endpoint" type="url" required placeholder="https://api.openai.com/v1"></label>
              <label><span data-t="modelId"></span><input name="model_id" required placeholder="gpt-4.1"></label>
              <label><span data-t="apiKey"></span><input name="api_key" type="password" autocomplete="new-password"></label>
              <p class="field-hint" data-t="keyHint"></p>
              <details><summary data-t="advanced"></summary><label><span data-t="protocol"></span><select name="protocol"><option value="openai">OpenAI compatible</option><option value="anthropic">Anthropic</option></select></label><label><span data-t="config"></span><textarea name="config" rows="3" spellcheck="false">{}</textarea></label></details>
              <label class="check-label"><input name="share_with_cloud" type="checkbox"><span data-t="shareModel"></span></label><p class="field-hint" data-t="shareHint"></p>
              <div class="form-actions"><button id="cancel-model" class="quiet-button" type="button" data-t="cancel"></button><button class="primary-button" type="submit" data-t="save"></button></div>
            </form>
            <p class="field-hint" data-t="modelHint"></p>
          </section>
          <section id="settings-cloud" role="tabpanel" aria-labelledby="settings-tab-cloud" hidden>
            <h3 data-t="cloud"></h3><p class="field-hint" data-t="serverHint"></p>
            <form id="cloud-form"><label><span data-t="cloudOrigin"></span><input name="origin" type="url" required placeholder="https://lester.example.com"></label><button class="secondary-button" type="submit" data-t="saveServer"></button></form>
            <div id="cloud-status" class="cloud-status"></div><div class="form-actions"><button id="cloud-login" class="primary-button" data-t="signIn"></button><button id="cloud-logout" class="quiet-button" data-t="signOut" hidden></button></div>
          </section>
        </div>
        <p id="settings-error" class="error settings-error" role="alert" hidden></p>
      </div>
    </div>
  </dialog>
</body>
</html>
